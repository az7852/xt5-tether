name: Sanitize initial commit identity
on:
  push:
    branches: [main]
    paths: [.github/workflows/sanitize-initial-history.yml]
permissions:
  contents: write
concurrency:
  group: sanitize-initial-history
  cancel-in-progress: false
jobs:
  sanitize:
    # One-time cleanup of the repository owner's initial commits.
    if: github.run_number == 1 && github.repository == 'az7852/xt5-tether'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Rewrite and verify commit identities
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          def git(*args, data=None, env=None, check=True):
              result = subprocess.run(['git', *args], input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env, check=check)
              return result.stdout

          head = os.environ.get('CLEANUP_HEAD', 'HEAD')
          old_head = git('rev-parse', head).decode().strip()
          identity = {'name': 'az7852', 'email': '24352023+az7852@users.noreply.github.com'}
          commits = git('rev-list', '--reverse', '--topo-order', old_head).decode().splitlines()
          rewritten = {}
          with tempfile.TemporaryDirectory(prefix='xt5-privacy-') as temp:
              index_env = {**os.environ, 'GIT_INDEX_FILE': str(Path(temp) / 'index')}
              for original in commits:
                  raw = git('cat-file', 'commit', original)
                  header, message = raw.split(b'\n\n', 1)
                  lines = header.splitlines()
                  tree = next(line[5:].decode() for line in lines if line.startswith(b'tree '))
                  parents = [line[7:].decode() for line in lines if line.startswith(b'parent ')]
                  dates = {}
                  for role in ['author', 'committer']:
                      line = next(line for line in lines if line.startswith((role + ' ').encode()))
                      match = re.search(rb'> ([0-9]+ [+-][0-9]{4})$', line)
                      if not match:
                          raise RuntimeError('Unsupported commit timestamp format')
                      dates[role] = match.group(1).decode()
                  # Keep the APK provenance link on the corresponding sanitized source commit.
                  exists = subprocess.run(['git', 'cat-file', '-e', tree + ':downloads/README.md'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
                  if exists:
                      document = git('show', tree + ':downloads/README.md')
                      updated = document
                      for before, after in rewritten.items():
                          updated = updated.replace(('/commit/' + before).encode(), ('/commit/' + after).encode())
                          updated = updated.replace(('[' + before[:7] + ']').encode(), ('[' + after[:7] + ']').encode())
                      if updated != document:
                          blob = git('hash-object', '-w', '--stdin', data=updated).decode().strip()
                          git('read-tree', tree, env=index_env)
                          git('update-index', '--add', '--cacheinfo', '100644,' + blob + ',downloads/README.md', env=index_env)
                          tree = git('write-tree', env=index_env).decode().strip()
                  commit_env = {**os.environ,
                      'GIT_AUTHOR_NAME': identity['name'], 'GIT_AUTHOR_EMAIL': identity['email'],
                      'GIT_COMMITTER_NAME': identity['name'], 'GIT_COMMITTER_EMAIL': identity['email'],
                      'GIT_AUTHOR_DATE': dates['author'], 'GIT_COMMITTER_DATE': dates['committer']}
                  args = ['commit-tree', tree]
                  for parent in parents:
                      if parent not in rewritten:
                          raise RuntimeError('Parent is outside the rewritten history')
                      args += ['-p', rewritten[parent]]
                  rewritten[original] = git(*args, data=message, env=commit_env).decode().strip()
          new_head = rewritten[old_head]
          # All repository files except the provenance link must remain byte-identical.
          changes = git('diff', '--name-only', old_head, new_head).decode().splitlines()
          if any(path != 'downloads/README.md' for path in changes):
              raise RuntimeError('Unexpected content changes: ' + ', '.join(changes))
          for commit in git('rev-list', new_head).decode().splitlines():
              actual = git('show', '-s', '--format=%an%n%ae%n%cn%n%ce', commit).decode().splitlines()
              if actual != [identity['name'], identity['email'], identity['name'], identity['email']]:
                  raise RuntimeError('Commit identity verification failed')
          print('Sanitized commits:', len(rewritten))
          print('Code and APK contents unchanged; provenance link updated.')
          print('Sanitized head:', new_head)
          output = os.environ.get('GITHUB_ENV')
          if output:
              with open(output, 'a', encoding='utf-8') as stream:
                  stream.write('CLEAN_HEAD=' + new_head + '\n')
          if os.environ.get('PRIVACY_PREVIEW_REF'):
              git('update-ref', os.environ['PRIVACY_PREVIEW_REF'], new_head)
          PYTHON
      - name: Publish sanitized history with an exact branch lease
        shell: bash
        run: |
          git push origin "$CLEAN_HEAD:refs/heads/main" "--force-with-lease=refs/heads/main:$GITHUB_SHA"
